[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hengce-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "arelle-release>=2.42.1,<2.43",
  "duckdb>=1.0,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "pypdfium2==5.13.0",
  "pdfminer.six==20251230",
  "pyarrow>=16,<20",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "rapidocr-onnxruntime>=1.4,<2",
  "tzdata>=2025.2; platform_system == \"Windows\"",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
hengce = "hengce.cli:app"

[project.optional-dependencies]
dev = [
  "hatchling>=1.25,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hengce"]
include = ["src/hengce/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
