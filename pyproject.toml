[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hengce-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.0,<2",
  "httpx>=0.27,<1",
  "pyarrow>=16,<20",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "typer>=0.12,<1",
]

[project.scripts]
hengce = "hengce.cli:app"

[project.optional-dependencies]
dev = [
  "hatchling>=1.25,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hengce"]
include = ["src/hengce/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
